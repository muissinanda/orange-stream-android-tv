name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.0-sports
        name: "Streamed TV v3.0 (Pure Sports - Zero Movies, Native AndroidX WebKit Sandbox Fix)"
        body: |
          ### 🏆 Streamed TV v3.0 - 100% Khusus Olahraga (Bebas Film)
          - **Murni Olahraga streamed.st**: Menghapus seluruh baris film bioskop dan drama. Aplikasi sekarang 100% murni siaran langsung olahraga dan saluran TV olahraga 24/7.
          - **Fix Tuntas Sandbox Error**: Menggunakan Google `WebViewCompat.addDocumentStartJavaScript` untuk meng-inject window.open mock polyfill langsung di level Chromium engine sebelum script apapun dijalankan.
          - **Bypass Proteksi embed.st**: Melucuti error 'Remove sandbox attributes on the iframe tag'.
          - **Multi-Device Support**: Berjalan mulus di HP Android (layar sentuh) dan Android TV (remote D-Pad).
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
