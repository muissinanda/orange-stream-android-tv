name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v2.1-native
        name: "Orange Stream TV v2.1 (Full Live Sports & TMDb Catalog)"
        body: |
          ### 🚀 Orange Stream TV v2.1 - Pure Native Android TV APK
          - **Sinkronisasi Penuh TMDb & Olahraga Live**: Menggunakan API Key aktif & proxy siaran resmi dari website film.boyblade.my.id.
          - **Saluran 24/7 & Pertandingan Live Lengkap**: Sky Sports, Tennis Channel, Rally TV, Sepak Bola, dll.
          - **Dual Playback Engine**: ExoPlayer untuk direct HLS/MP4 + Fullscreen Hardware-accelerated Engine untuk Web Embeds.
          - **Full Xiaomi Mi TV 4A & D-Pad Remote Support**: Navigasi presisi tanpa mouse toggle / kursor.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
