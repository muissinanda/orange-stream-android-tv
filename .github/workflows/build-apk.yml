name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.2-modern-ui
        name: "Streamed TV v3.2 (Super Modern UI/UX - Glassmorphism, Cinematic Backdrop & Touch Controls)"
        body: |
          ### ✨ Streamed TV v3.2 - Upgrade UI/UX Modern & Sinematik
          - 🎨 **Desain Kartu Premium (Card Visuals)**:
            - Sudut kartu melengkung modern (*rounded corners 12dp*) dengan *stroke border* dinamis.
            - Efek neon *glowing border* oranye (`#FF6B00`) & elevasi bayangan halus saat kartu disorot remote TV atau disentuh di HP.
          - 🏷️ **Status Tayang Warna-Warni (Rich Status Badges)**:
            - Pertandingan **🔴 SEDANG LIVE**: Teks merah menyala tebal (*Vivid Red*).
            - Saluran **⚡ Saluran TV 24/7**: Teks emas (*Amber Gold*).
            - Jadwal **Hari ini**: Teks hijau emerald (*Emerald Green*).
            - Jadwal **Besok**: Teks biru cerah (*Sky Blue*).
          - 🎬 **Cinematic Backdrop & Vignette**:
            - Background layar otomatis menyesuaikan poster pertandingan yang sedang dipilih dengan efek *vignette cinema gradient* gelap yang elegan (seperti Apple TV / Disney+), menjaga kenyamanan mata dan keterbacaan teks.
          - 🔍 **Smooth Focus Zoom Highlight**:
            - Baris Leanback TV kini memiliki animasi *smooth zoom scale* dan *drop shadow* saat berpindah antar kartu menggunakan D-Pad remote.
          - 📱 **Mobile Touch HUD & Quick Controls (Khusus HP & TV)**:
            - Mengetuk layar saat streaming menampilkan *Top Control Bar* transparan (*Glassmorphism*):
              - Tombol **← Kembali** untuk keluar cepat tanpa perlu gesture swipe sistem.
              - Judul siaran & status kualitas HD.
              - Tombol **🔄 Muat Ulang** untuk reload stream seketika jika buffer macet.
              - Otomatis hilang mulus (*fade out*) dalam 4 detik.
            - Tampilan **Loading HUD Glassmorphism** baru di tengah layar saat stream dipersiapkan.
          - 🎮 **D-Pad Remote Pintar (Android TV)**:
            - Tekan tombol **Atas / Bawah** untuk menampilkan/menyembunyikan bar kontrol.
            - Tekan **OK / Center** untuk Pause / Play siaran web.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
