name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v2.3-native
        name: "Orange Stream TV v2.3 (Bypass Sandbox Error, Subframe Interceptor & VidLink Pro)"
        body: |
          ### 🚀 Orange Stream TV v2.3 - Pure Native Android TV APK
          - **Fix Tuntas Error "Remove sandbox attributes on the iframe tag"**: Intersepsi synchronous HTML di seluruh frame (main frame & subframe iframe) via `shouldInterceptRequest`.
          - **Penghapusan Atribut Sandbox Otomatis**: Secara otomatis menghapus atribut `sandbox` pada setiap tag iframe sebelum dirender browser WebView.
          - **Universal window.open Polyfill**: Memastikan `window.open` mengembalikan valid window proxy sehingga skrip player tidak gagal atau menampilkan error banner.
          - **Integrasi VidLink Pro sebagai Server 1**: Menyamakan dengan website utama untuk streaming film & TV series kualitas Super HD tanpa iklan pop-up.
          - **Blokir Iklan & Redirect Tracker**: Memblokir skrip popunder dan iklan yang mengganggu kenyamanan menonton di TV.
          - **Full Xiaomi Mi TV 4A & D-Pad Remote Support**: Navigasi presisi 100% menggunakan tombol panah remote TV tanpa perlu mode kursor / mouse.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
