name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.3-premium-redesign
        name: "Streamed TV v3.3 (Luxury Redesign - Dark Obsidian Sidebar, Visible Card Metadata & Sports Stadium)"
        body: |
          ### 🏆 Streamed TV v3.3 - Redesain Mewah Ala Aplikasi Streaming Premium
          - 🖤 **Fix Fatal Sidebar Terang**: Menghilangkan sidebar oranye silau yang menutupi sepertiga layar. Menggantinya dengan laci navigasi gelap elegan (*Obsidian Black* `#090C13`) khas Apple TV, Netflix & DAZN.
          - 🃏 **Kartu Tayangan Modern 100% Baru (`item_sport_card`)**:
            - **Judul Terbaca Jelas**: Judul pertandingan dijamin 100% muncul jelas dengan teks putih tebal (tidak lagi hilang/kosong).
            - **Badge `● LIVE` Menyala**: Indikator siaran langsung merah menyala di sudut kiri atas poster.
            - **Badge Kategori Olahraga**: Pill transparan modern di sudut kanan atas (cth: `⚽ FOOTBALL`, `🏀 NBA`, `🏎️ MOTOR`, `🥊 COMBAT`).
            - **Status Kickoff Berwarna**: Warna status dinamis (Merah untuk Live, Emas untuk 24/7 TV, Hijau untuk Hari ini).
            - **Animasi Remote TV**: Border neon oranye (`#FF6B00`) & pembesaran kartu halus saat disorot D-Pad Mi TV.
          - 🏟️ **Placeholder Stadion Olahraga (No Cinema Seats)**:
            - Menghapus tuntas gambar kursi bioskop merah Unsplash dan banner film lama. Semua laga otomatis berlatar belakang stadion olahraga modern.
          - ⚡ **Branding Minimalis streamed.st**:
            - Menghapus logo lama yang mengambang canggung. Digantikan dengan header tipografi elegan `⚡ STREAMED.ST • LIVE SPORTS`.
          - 📱 **Mobile Touch Controls & Full Android TV Support**:
            - Sentuh layar untuk Top Bar (tombol Kembali, Reload, Judul).
            - 100% Navigasi remote Xiaomi Mi TV 4A.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
