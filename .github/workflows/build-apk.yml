name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.4-exoplayer-upgrade
        name: "Streamed TV v3.4 (Fix Blackscreen Mi TV 4A, Auto HLS Extraction & Google Media3 ExoPlayer Upgrade)"
        body: |
          ### 🚀 Streamed TV v3.4 - Upgrade Media Player & Fix Tuntas Blackscreen TV
          - ⚡ **Auto-Switch Native Google ExoPlayer (Media3)**:
            - Otomatis mengekstrak streaming langsung HLS (`.m3u8`) dari embed dan langsung memutarnya di player native Google ExoPlayer!
            - Ringan maksimal: Konsumsi memori turun dari 300MB (browser) menjadi hanya 25MB (native player). Mi TV 4A (1GB RAM) tidak lagi sesak atau drop video.
            - Akselerasi hardware langsung ke GPU Mali-450 TV dengan fallback decoder anti-macet.
          - 🛠️ **Fix Tuntas Layar Hitam (Black Screen with Audio)**:
            - Mengganti `surface_view` menjadi `texture_view` di PlayerView untuk mencegah bug *punch-through occlusion* pada chipset Amlogic Mi TV.
            - Menambahkan kontainer fullscreen kustom mandiri (*CustomViewContainer*) dan CSS video viewport 100vw/100vh agar video tidak pernah kehilangan rendering context.
            - Hardware acceleration layer langsung di level WebView.
          - 🎮 **Badge Player & Dual Engine**:
            - Menampilkan indikator engine di Top Bar (`⚡ EXOPLAYER HD` / `🌐 WEB ENGINE`).
            - Tombol Reload seketika merefresh stream jika koneksi internet terputus.
            - Remote D-Pad: OK/Center untuk Play/Pause, Atas/Bawah untuk info HUD bar.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
