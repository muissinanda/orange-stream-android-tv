name: Build Pure Native Android TV APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug

    - name: Prepare APK Output
      run: |
        cp app/build/outputs/apk/debug/app-debug.apk OrangeStreamTV-PureNative.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: OrangeStreamTV-PureNative
        path: OrangeStreamTV-PureNative.apk

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
      with:
        tag_name: v3.1-autoplay-fix
        name: "Streamed TV v3.1 (Fix Jadwal & Jam Kickoff streamed.st + Autoplay Otomatis)"
        body: |
          ### 🏆 Streamed TV v3.1 - Update Akurasi Jadwal & Autoplay Otomatis
          - ⏰ **Akurasi Jam & Tanggal Tayang**: Menampilkan waktu kick-off nyata sesuai API streamed.st yang disesuaikan ke waktu lokal/WIB (cth: "🔴 SEDANG LIVE • 17:30 WIB", "Hari ini, 20:00 WIB", "Besok, 02:00 WIB", dan "⚡ Saluran TV 24/7").
          - ▶️ **Autoplay Otomatis**: Streaming langsung otomatis diputar saat kartu dipilih/dibuka tanpa perlu klik tombol play manual di layar.
          - 🎮 **Navigasi TV Remote Lebih Fleksibel**: Tombol DPAD Center / OK / Play-Pause remote TV kini dapat digunakan untuk toggle play/pause langsung pada pemutar web.
          - 🛡️ **Bypass Anti-Sandbox & Proteksi embed.st**: Menggunakan injeksi native WebViewCompat engine Chromium.
          - 📱 **100% Native Multi-Device**: Kompatibel di HP Samsung/Android dan Android TV Xiaomi.
        files: |
          OrangeStreamTV-PureNative.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
